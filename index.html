<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hormuud Digital Signage - Fixed Audio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #010409; color: white; overflow: hidden; min-height: 100vh; display: flex; flex-direction: column; }
        .slide { display: none; animation: fadeIn 0.8s ease; width: 100%; flex-grow: 1; }
        .slide.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .progress-container { height: 12px; background: rgba(255, 255, 255, 0.05); position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100; }
        #progress-fill { height: 100%; background: #2563eb; width: 0%; box-shadow: 0 0 15px #2563eb; }
        .package-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 40px; text-align: center; }
        #start-overlay { position: fixed; inset: 0; background: #010409; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .video-container { width: 90%; max-width: 1100px; aspect-ratio: 16/9; border-radius: 45px; overflow: hidden; border: 10px solid #111; background: black; }
    </style>
</head>
<body class="p-8">

    <div id="start-overlay">
        <div class="w-32 h-32 bg-blue-600 rounded-[45px] flex items-center justify-center shadow-2xl mb-12 animate-pulse">
            <span class="text-white font-black text-7xl italic">H</span>
        </div>
        <button id="start-btn" class="px-20 py-10 bg-blue-600 hover:bg-blue-700 text-white rounded-full font-black text-5xl transition-all transform hover:scale-110 shadow-2xl">
            BILOW BANDHIGGA
        </button>
        <p class="mt-8 text-slate-500 text-2xl font-light uppercase tracking-widest italic">Hormuud Digital Signage</p>
    </div>

    <header class="flex justify-between items-center mb-12 z-50">
        <div class="flex items-center gap-10">
            <div class="w-24 h-24 bg-blue-600 rounded-[30px] flex items-center justify-center shadow-2xl">
                <span class="text-white font-black text-6xl italic">H</span>
            </div>
            <div>
                <h1 class="text-6xl font-black uppercase italic leading-none">Hormuud</h1>
                <p class="text-blue-500 font-bold uppercase tracking-widest text-sm mt-4 italic">Wehelka Nolosha</p>
            </div>
        </div>
        <div class="bg-white/5 backdrop-blur-3xl px-14 py-8 rounded-[50px] border border-white/10 shadow-2xl">
            <div id="clock" class="text-blue-500 font-black text-7xl italic tabular-nums leading-none">00:00</div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center">
        <!-- Slide 0 -->
        <div id="slide-0" class="slide active text-center">
            <h2 class="text-9xl font-black tracking-tighter uppercase italic text-white drop-shadow-2xl">WAAYAHA <br /> <span class="text-blue-600">NOLOSHA</span></h2>
            <p class="text-4xl text-slate-400 font-light italic mt-10">HORMUUD TELECOM</p>
        </div>

        <!-- Slide 1 -->
        <div id="slide-1" class="slide space-y-12">
            <h3 class="text-[10rem] font-black text-blue-500 italic uppercase">ANFAC PLUS</h3>
            <p class="text-7xl font-black italic text-white animate-pulse">GARAAC *222*2#</p>
        </div>

        <!-- Slide 2 -->
        <div id="slide-2" class="slide space-y-12">
            <h3 class="text-[10rem] font-black text-green-500 italic uppercase">KUDHAN</h3>
            <p class="text-7xl font-black italic text-white">GARAAC *222*4#</p>
        </div>

        <!-- Slide 3 -->
        <div id="slide-3" class="slide max-w-6xl text-center px-10">
            <h3 class="text-8xl font-black text-red-500 italic mb-10">DIGNIIN AMMAAN</h3>
            <p class="text-6xl italic leading-tight text-slate-300">Marna qofna halla wadaagin furayaashaada sirta ah ee EVC Plus.</p>
        </div>

        <!-- Slide 4 -->
        <div id="slide-4" class="slide">
            <div class="video-container">
                <video id="promo-video" class="w-full h-full object-cover" muted playsinline>
                    <source src="https://github.com/user-attachments/assets/8b7e879a-e686-4896-806d-e5d2e6f57ff7" type="video/mp4">
                </video>
            </div>
        </div>
    </main>

    <div class="progress-container"><div id="progress-fill"></div></div>

    <script>
        const apiKey = ""; // Environment handles authentication
        let currentIdx = 0;

        // PCM TO WAV Function (Essential for Audio Fix)
        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function speakDeep(text) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Dheh adigoo ah nin Soomaali ah oo cod aad u culus (Very Deep Voice): ${text}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Enceladus" } } }
                        }
                    })
                });
                const result = await response.json();
                const audioData = result.candidates[0].content.parts[0].inlineData.data;
                const pcm = new Int16Array(Uint8Array.from(atob(audioData), c => c.charCodeAt(0)).buffer);
                const wav = pcmToWav(pcm, 24000);
                const audio = new Audio(URL.createObjectURL(wav));
                audio.play();
            } catch (e) { console.error("Codka Error:", e); }
        }

        function runSlides() {
            const slides = [
                { id: 'slide-0', time: 12, script: "Ku soo dhawaada Hormuud Telekom. Wehelkaaga dhabta ah ee nolosha." },
                { id: 'slide-1', time: 12, script: "Xirmooyinka Anfac Plus. Garaac xiddig labo labo labo xiddig labo#" },
                { id: 'slide-2', time: 12, script: "Xirmooyinka Kudhan ee Hormuud. Garaac xiddig labo labo labo xiddig afar#" },
                { id: 'slide-3', time: 12, script: "Digniin ammaan. Marna qofna halla wadaagin furahaaga sirta ah ee EVC Plus." },
                { id: 'slide-4', time: 59, script: "Hadda daawo muuqaalka bandhigga rasmiga ah ee Hormuud Telekom." }
            ];

            const currentSlide = slides[currentIdx];
            
            // UI Updates
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            document.getElementById(currentSlide.id).classList.add('active');

            // Video Control
            const vid = document.getElementById('promo-video');
            if (currentIdx === 4) {
                vid.currentTime = 0;
                vid.play();
            } else {
                vid.pause();
            }

            // Audio
            speakDeep(currentSlide.script);

            // Progress Bar
            const bar = document.getElementById('progress-fill');
            bar.style.transition = 'none'; bar.style.width = '0%';
            setTimeout(() => {
                bar.style.transition = `width ${currentSlide.time}s linear`;
                bar.style.width = '100%';
            }, 50);

            // Next Slide Timer
            setTimeout(() => {
                currentIdx = (currentIdx + 1) % slides.length;
                runSlides();
            }, currentSlide.time * 1000);
        }

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('start-overlay').style.display = 'none';
            setInterval(() => {
                document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            }, 1000);
            runSlides();
        };
    </script>
</body>
</html>
